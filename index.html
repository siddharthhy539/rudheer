<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rudheer's First Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container nav">
      <a href="index.html" class="brand">
        <span class="brand-badge">🚀</span>
        <span>Rudheer's Space Party</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="baby.html">Our Baby</a>
        <a href="details.html">Details</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </div>
  </header>

  <section class="hero-grid">
    <div class="hero-copy fade-in">
      <span class="tag"><span class="tag-dot"></span> Space Party</span>
      <h1>Rudheer is turning one!</h1>
      <p>Join us for a cosmic celebration with stars, rockets, and lots of fun! All the details below.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="details.html">See Party Details</a>
        <a class="btn btn-secondary" href="https://maps.google.com/?q=Peacock+Banquet+Hall+6622+Dublin+Blvd+Dublin+CA+94568" target="_blank">Get Directions</a>
      </div>
    </div>
    <div class="hero-art fade-in" style="position: relative; height: 360px;">
      <svg viewBox="0 0 520 360" width="100%" height="100%" aria-hidden="true" style="overflow: visible;">
        <defs>
          <linearGradient id="trailGlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#87b9ff" stop-opacity="0.05"/>
            <stop offset="35%" stop-color="#87b9ff" stop-opacity="0.5"/>
            <stop offset="70%" stop-color="#ffd86f" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
          </linearGradient>
          <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- Earth -->
        <circle cx="92" cy="282" r="42" fill="#2b6de0" opacity="0.95"/>
        <path d="M64 280c8-18 26-30 50-34 7 9 13 19 16 31-15 7-31 11-46 11-8 0-15-2-20-8Z" fill="#7ed957" opacity="0.95"/>
        <path d="M101 245c10 4 19 11 27 21-2 9-7 18-13 24-9-6-16-13-22-22 1-10 4-18 8-23Z" fill="#6ac36a" opacity="0.9"/>

        <!-- Launch trail -->
        <path d="M122 262 C 170 224, 202 190, 245 150 S 340 75, 425 86" stroke="url(#trailGlow)" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>
        <path d="M122 262 C 170 224, 202 190, 245 150 S 340 75, 425 86" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" fill="none" stroke-linecap="round"/>

        <!-- Rocket -->
        <g transform="translate(235 165) rotate(-22)">
          <ellipse cx="0" cy="0" rx="20" ry="34" fill="#f4f8ff"/>
          <ellipse cx="0" cy="-4" rx="10" ry="18" fill="#87b9ff" opacity="0.95"/>
          <circle cx="0" cy="-2" r="6" fill="#0d1b3d"/>
          <path d="M-18 16 L-34 32 L-10 24 Z" fill="#ffcf66"/>
          <path d="M18 16 L34 32 L10 24 Z" fill="#ffcf66"/>
          <path d="M-8 30 C -10 40, -4 52, 0 58 C 4 52, 10 40, 8 30" fill="#ff9e6e" opacity="0.85"/>
          <path d="M-4 32 C -6 40, -2 48, 0 52 C 2 48, 6 40, 4 32" fill="#ffd86f" opacity="0.9"/>
        </g>

        <!-- Saturn / star destination -->
        <g transform="translate(414 84)">
          <circle cx="0" cy="0" r="34" fill="#ffd86f" opacity="0.95"/>
          <ellipse cx="0" cy="2" rx="48" ry="14" fill="none" stroke="#f4f8ff" stroke-opacity="0.35" stroke-width="4"/>
          <circle cx="50" cy="-20" r="4" fill="#ffffff"/>
        </g>

        <!-- small stars -->
        <circle cx="360" cy="34" r="3" fill="#ffffff" opacity="0.75"/>
        <circle cx="470" cy="40" r="2.5" fill="#ffffff" opacity="0.55"/>
        <circle cx="300" cy="22" r="2" fill="#ffffff" opacity="0.6"/>
        <circle cx="445" cy="154" r="2.5" fill="#ffffff" opacity="0.5"/>
      </svg>
    </div>
  </section>

  <footer>
    <div class="container">Rudheer Potu • July 11, 2026 • California</div>
  </footer>
</body>
</html>
