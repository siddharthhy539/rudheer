  <section class="hero-grid">
    <div class="hero-copy fade-in">
      <span class="tag"><span class="tag-dot"></span> Space Party</span>
      <h1>T-minus 1 year and counting… Happy 1st Birthday, Rudheer!</h1>
      <p>Join us for a cosmic celebration with stars, rockets, and lots of fun!<br>All the details below.</p>

      <div id="countdown"></div>

      <div class="hero-actions">
        <a class="btn btn-secondary" href="details.html">Party Details</a>

    <div class="hero-art fade-in" style="position: relative; height: 640px; transform: scale(1.0); transform-origin: center; overflow: visible;">
      <!-- your SVG here -->
    </div>

  <footer><div class="container">Rudheer Potu • July 11, 2026 • California</div></footer>

  <script>
    const targetDate = new Date("2026-07-11T00:00:00").getTime();
    const el = document.getElementById("countdown");

    function updateCountdown() {
      const now = Date.now();
      const diff = targetDate - now;

      if (diff <= 0) {
        el.textContent = "Today is the party!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      el.textContent = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
